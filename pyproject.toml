[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-transport"
version = "0.1.0"
description = "A self-play testbed for history-based learned network protocols"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
learn = ["torch>=2.1"]

[dependency-groups]
dev = ["pytest>=7"]

[project.scripts]
trace-transport = "trace_transport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trace_transport = ["scenarios/*.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
